services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: concursohub
      POSTGRES_USER: concursohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concursohub"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://concursohub:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/concursohub
      DADOS_DIR: /app/dados
    ports:
      - "127.0.0.1:8000:8000"   # só acessível no seu computador
    volumes:
      - ./dados:/app/dados
    depends_on:
      db:
        condition: service_healthy

  # Roda a coleta + avisos a cada 3 horas (o DOU no máximo a cada 6h).
  agendador:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://concursohub:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/concursohub
      DADOS_DIR: /app/dados
    volumes:
      - ./dados:/app/dados
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: >
      sh -c "sleep 60; while true; do python manage.py rotina; sleep $${INTERVALO_COLETA_SEG:-10800}; done"

volumes:
  pgdata:
